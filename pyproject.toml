[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocut"
version = "0.0.1"
description = "Voiceover-first long-form video editor for knowledge creators."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "vocut contributors" }]
keywords = ["video", "editing", "voiceover", "knowledge", "motion-graphics", "remotion"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # P0.1 — index pipeline (transcribe + embed + store)
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26",
    "av>=12.0",              # PyAV — audio extraction for Whisper
    "imageio-ffmpeg>=0.5.0", # bundles ffmpeg binary cross-platform (no system install)
    "Pillow>=10.0",          # text-card rendering for motion-graphic placeholders (P0.4)
    "tqdm>=4.66",
    # P0.2 — plan (LLM rerank). Either provider works:
    "anthropic>=0.40.0",
    "openai>=1.50.0",        # also supports any OpenAI-compatible base_url
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
fetch = [
    # Optional footage downloader. Install with: pip install vocut[fetch]
    # Users are responsible for copyright / fair-use compliance.
    "yt-dlp>=2024.10.7",
]

[project.scripts]
vocut = "vocut.cli:main"

[project.urls]
Homepage = "https://github.com/akiliu38843-home/vocut"
Issues = "https://github.com/akiliu38843-home/vocut/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vocut"]

[tool.ruff]
target-version = "py310"
line-length = 100
