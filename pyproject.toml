[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocut"
version = "0.0.1"
description = "Voiceover-first long-form video editor for knowledge creators."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "vocut contributors" }]
keywords = ["video", "editing", "voiceover", "knowledge", "motion-graphics", "remotion"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # P0 — populated as we wire up the pipeline
    # "openai-whisper>=20240930",
    # "moviepy>=2.0.0",
    # "auto-editor>=27.0.0",
    # "anthropic>=0.40.0",
    # "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
vocut = "vocut.cli:main"

[project.urls]
Homepage = "https://github.com/akiliu38843-home/vocut"
Issues = "https://github.com/akiliu38843-home/vocut/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vocut"]

[tool.ruff]
target-version = "py310"
line-length = 100
